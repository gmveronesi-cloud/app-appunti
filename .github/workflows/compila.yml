name: Compila

# Risparmio minuti: niente compilazione per modifiche a documenti/prove, una sola compilazione
# per volta per ramo (le vecchie si annullano), schermata solo su richiesta.
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'prove/**'
  pull_request:
  workflow_dispatch:

concurrency:
  group: compila-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  compila:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Scegli l'Xcode più recente
        run: |
          LATEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$LATEST" ]; then sudo xcode-select -s "$LATEST/Contents/Developer"; fi
          xcodebuild -version
          xcrun --sdk iphonesimulator --show-sdk-version

      - name: Compila per simulatore iPad
        working-directory: Appunti.swiftpm
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme Appunti \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      # Solo se si lancia a mano («Run workflow») o se il messaggio del commit contiene [schermata]
      - name: Schermata di avvio nel simulatore iPad
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[schermata]')
        continue-on-error: true
        run: |
          APP=$(find "$RUNNER_TEMP/dd" -name "Appunti.app" -type d | head -1)
          DEV=$(xcrun simctl list devices available | grep -E "iPad" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$DEV"
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          xcrun simctl launch "$DEV" it.cristina.appunti
          sleep 6
          mkdir -p "$RUNNER_TEMP/esito"
          xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/esito/avvio.png"

      # Solo con «Run workflow» o con [prova] nel messaggio del commit: prova di prestazioni della vista doppia (vedi Editor/ProvaPrestazioni.swift)
      - name: Prova di prestazioni nel simulatore iPad
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[prova]')
        continue-on-error: true
        run: |
          APP=$(find "$RUNNER_TEMP/dd" -name "Appunti.app" -type d | head -1)
          DEV=$(xcrun simctl list devices available | grep -E "iPad" | head -1 | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          xcrun simctl boot "$DEV" || true
          xcrun simctl bootstatus "$DEV" -b
          xcrun simctl install "$DEV" "$APP"
          SIMCTL_CHILD_APT_PROVA=1 xcrun simctl launch "$DEV" it.cristina.appunti
          mkdir -p "$RUNNER_TEMP/esito"
          DATA=$(xcrun simctl get_app_container "$DEV" it.cristina.appunti data)
          for i in $(seq 1 24); do
            sleep 5
            if grep -q "FINE" "$DATA/Documents/prova.txt" 2>/dev/null; then break; fi
          done
          cp "$DATA/Documents/prova.txt" "$RUNNER_TEMP/esito/prova.txt" 2>/dev/null || echo "prova.txt non creato" > "$RUNNER_TEMP/esito/prova.txt"
          xcrun simctl io "$DEV" screenshot "$RUNNER_TEMP/esito/prova.png" || true

      - name: Salva esito sul ramo "esiti"
        if: always()
        run: |
          OUT="$RUNNER_TEMP/esito"; mkdir -p "$OUT"
          { echo "commit: $GITHUB_SHA"; xcodebuild -version; echo; echo "== ERRORI =="; grep -E "error:" "$RUNNER_TEMP/build.log" | sort -u | head -100; echo; echo "== AVVISI =="; grep -E "warning:" "$RUNNER_TEMP/build.log" | sort -u | head -100; echo; echo "== FINE LOG =="; tail -40 "$RUNNER_TEMP/build.log"; } > "$OUT/riassunto.txt" 2>&1 || true
          cp "$RUNNER_TEMP/build.log" "$OUT/build.log" 2>/dev/null || true
          cd "$OUT"
          git init -q -b esiti
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Esito compilazione $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" esiti
