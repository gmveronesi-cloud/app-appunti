name: Prova PDFKit
on:
  workflow_dispatch:
    inputs:
      programma:
        description: "Nome del file in prove/ (senza .swift)"
        default: "pdfkit-immagini"
      sorgenti:
        description: "File aggiuntivi da compilare insieme (separati da spazio)"
        default: ""
permissions:
  contents: write
jobs:
  prova:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Esegui la prova
        run: |
          mkdir -p "$RUNNER_TEMP/esito"
          mkdir -p "$RUNNER_TEMP/src"
          cp "prove/${{ inputs.programma }}.swift" "$RUNNER_TEMP/src/main.swift"
          EXTRA=""
          for f in ${{ inputs.sorgenti }}; do cp "$f" "$RUNNER_TEMP/src/"; EXTRA="$EXTRA $RUNNER_TEMP/src/$(basename $f)"; done
          swiftc -O "$RUNNER_TEMP/src/main.swift" $EXTRA -o "$RUNNER_TEMP/prova" > "$RUNNER_TEMP/esito/compila.txt" 2>&1 || true
          "$RUNNER_TEMP/prova" "$RUNNER_TEMP/esito/file" > "$RUNNER_TEMP/esito/risultato.txt" 2>&1 || true
      - name: Controllo con qpdf
        if: always()
        run: |
          cd "$RUNNER_TEMP/esito"
          (brew install qpdf > /dev/null 2>&1 && for f in file/*.pdf file/*.bin; do if [ -f "$f" ]; then echo "== $f ($(stat -f%z "$f") byte)"; qpdf --check "$f" 2>&1 | tail -8; fi; done) > controllo.txt 2>&1 || true
          find file -size +20M -delete 2>/dev/null || true
      - name: Salva esito sul ramo "prova"
        if: always()
        run: |
          cd "$RUNNER_TEMP/esito"
          git init -q -b prova
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -q -m "Esito prova"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prova
